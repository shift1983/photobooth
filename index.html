<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Photobooth</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">

    <meta name="theme-color" content="#111111">
</head>
<body>

<main>
	
	<div id="logoArea">
    <div id="appLogo">📸 Photobooth</div>
	</div>
	
	<div id="countdownOverlay"></div>

	<div id="flashOverlay"></div>

	<h1 id="eventTitleDisplay">
		    Photobooth
	</h1>

<div id="photoCountInfo">
    Fotos pro Serie: 4
</div>

<div id="seriesProgress">
    Foto 1 von 4
</div>

	<button id="startBoothBtn">
  	  📸 Photobooth starten
	</button>

	<button id="captureBtn">
    📸 Foto aufnehmen
	</button>

    <div id="cameraContainer">

        <video
            id="video"
            autoplay
            playsinline
            muted>
        </video>

    </div>

	<canvas id="photoCanvas"></canvas>

	<img id="photoPreview" alt="Vorschau">

	<canvas id="collageCanvas"></canvas>

	<img id="collagePreview" alt="Fotokarte">

<div id="photoActions">
    <button id="saveBtn">💾 Speichern</button>
    <button id="retakeBtn">🔄 Nochmal</button>
    <button id="nextBtn">➡️ Weiter</button>
    <button id="newSeriesBtn">📸 Neue Fotoserie</button>
</div>

<div id="pinOverlay">

    <div id="pinPanel">

        <h2>🔐 Admin-Zugang</h2>

        <input
            id="adminPinInput"
            type="password"
            inputmode="numeric"
            maxlength="4"
            placeholder="PIN"
        >

        <div id="pinError">
            PIN nicht korrekt
        </div>

        <div class="pinButtons">
            <button id="pinCancelBtn">
                Abbrechen
            </button>

            <button id="pinOkBtn">
                Anmelden
            </button>
        </div>

    </div>

</div>
	
// 	Adminbereich
	
	<div id="adminOverlay">

    <div id="adminPanel">

        <h2>⚙️ Adminbereich</h2>

        <p>
            Photobooth-Einstellungen
        </p>


        <div class="adminSection">

            <h3>🎭 Event</h3>

            <div id="themeSelection">

                <button
                    class="themeBtn"
                    data-theme="birthday">
                    🎂 Geburtstag
                </button>

                <button
                    class="themeBtn"
                    data-theme="wedding">
                    💍 Hochzeit
                </button>

                <button
                    class="themeBtn"
                    data-theme="business">
                    🏢 Firmenfeier
                </button>

            </div>

		<div class="adminSection">

    			<h3>✏️ Titel</h3>

    			<input
        			id="eventTitleInput"
        			type="text"
        			value="Photobooth"
        			maxlength="60"
    			>

			</div>
			
        </div>


        <div class="adminSection">

            <h3>📷 Anzahl der Fotos</h3>

            <div id="photoCountSelection">

                <button
                    class="photoCountBtn"
                    data-count="3">
                    3 Fotos
                </button>

                <button
                    class="photoCountBtn"
                    data-count="4">
                    4 Fotos
                </button>

            </div>

        </div>

		<div class="adminSection">

    <h3>⏱ Aufnahme</h3>

    <div class="adminSettingRow">
        <label for="countdownSelect">
            Countdown
        </label>

        <select id="countdownSelect">
            <option value="3">3 Sekunden</option>
            <option value="5">5 Sekunden</option>
            <option value="10">10 Sekunden</option>
        </select>
    </div>

    <div class="adminSettingRow">
        <label>
            <input
                type="checkbox"
                id="flashEnabled"
            >
            Bildschirmblitz
        </label>
    </div>

    <div class="adminSettingRow">
        <label>
            <input
                type="checkbox"
                id="soundEnabled"
            >
            Auslöseton
        </label>
    </div>

</div>

        <div class="adminSection">

            <h3>🎨 Kartendesign</h3>

            <div id="designSelection">

                <button
                    class="designBtn"
                    data-design="birthdayConfetti">
                    🎉 Konfetti
                </button>

                <button
                    class="designBtn"
                    data-design="birthdayParty">
                    🥳 Party
                </button>

            </div>

        </div>


        <button id="closeAdminBtn">
            Einstellungen übernehmen
        </button>

    </div>

</div>
	
</main>
	<script src="app.js"></script>
		
</body>
</html>
