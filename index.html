<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Photobooth</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">

    <meta name="theme-color" content="#111111">
</head>
<body>

<main>
	<div id="countdownOverlay"></div>

	<div id="flashOverlay"></div>

<input
    id="eventTitle"
    value="Photobooth">

<div id="photoCountInfo">
    Fotos pro Serie: 4
</div>

<div id="seriesProgress">
    Foto 1 von 4
</div>

<div id="themeSelection">

    <button class="themeBtn"
            data-theme="birthday">
        🎂 Geburtstag
    </button>

    <button class="themeBtn"
            data-theme="wedding">
        💍 Hochzeit
    </button>

    <button class="themeBtn"
            data-theme="business">
        🏢 Firmenfeier
    </button>

</div>

<div id="designSelection">

    <button
        class="designBtn"
        data-design="birthdayConfetti">
        🎉 Konfetti
    </button>

    <button
        class="designBtn"
        data-design="birthdayParty">
        🥳 Party
    </button>

</div>
	
    <button id="fullscreenBtn">
        Vollbild aktivieren
    </button>

    <button id="cameraBtn">
        Kamera starten
    </button>

	<button id="captureBtn">
    📸 Foto aufnehmen
	</button>

    <div id="cameraContainer">

        <video
            id="video"
            autoplay
            playsinline
            muted>
        </video>

    </div>

	<canvas id="photoCanvas"></canvas>

	<img id="photoPreview" alt="Vorschau">

	<canvas id="collageCanvas"></canvas>

	<img id="collagePreview" alt="Fotokarte">

<div id="photoActions">
    <button id="saveBtn">💾 Speichern</button>
    <button id="retakeBtn">🔄 Nochmal</button>
    <button id="nextBtn">➡️ Weiter</button>
    <button id="newSeriesBtn">📸 Neue Fotoserie</button>
</div>

</main>
	<script src="app.js"></script>
		
</body>
</html>
